[platformio]
description = KX134 single sensor node I2C prototype
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600

lib_deps =
    https://github.com/sparkfun/SparkFun_KX13X_Arduino_Library.git

build_flags =
    -D KX134_SENSOR_ID=1
    -D KX134_SAMPLE_RATE_HZ=100
    -D KX134_RANGE_G=8
    -D KX134_I2C_SDA=21
    -D KX134_I2C_SCL=22
    -D KX134_I2C_FREQ_HZ=400000
    -D KX134_SERIAL_BAUD=921600
