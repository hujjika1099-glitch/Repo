[platformio]
description = KX134 single sensor node I2C prototype
default_envs = kx134_sensor_1

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600

lib_deps =
    https://github.com/sparkfun/SparkFun_KX13X_Arduino_Library.git

[common]
build_flags_base =
    -D KX134_SAMPLE_RATE_HZ=100
    -D KX134_RANGE_G=8
    -D KX134_I2C_SDA=21
    -D KX134_I2C_SCL=22
    -D KX134_I2C_FREQ_HZ=400000
    -D KX134_SERIAL_BAUD=921600

[env:kx134_sensor_1]
build_flags =
    ${common.build_flags_base}
    -D KX134_SENSOR_ID=1

[env:kx134_sensor_2]
build_flags =
    ${common.build_flags_base}
    -D KX134_SENSOR_ID=2

[env:esp32dev]
build_flags =
    ${common.build_flags_base}
    -D KX134_SENSOR_ID=1
