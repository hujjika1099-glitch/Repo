[platformio]
description = KX134 dual ESP-NOW prototype with two sensor nodes and one USB serial receiver
default_envs = kx134_receiver_espnow

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600

lib_deps =
    https://github.com/sparkfun/SparkFun_KX13X_Arduino_Library.git

[common]
build_flags_base =
    -D KX134_SAMPLE_RATE_HZ=100
    -D KX134_ODR_HZ=100
    -D KX134_RANGE_G=8
    -D KX134_I2C_SDA=21
    -D KX134_I2C_SCL=22
    -D KX134_I2C_FREQ_HZ=400000
    -D KX134_SERIAL_BAUD=921600
    -D KX134_ESPNOW_CHANNEL=1
    -D KX134_RECEIVER_MAC0=0x00
    -D KX134_RECEIVER_MAC1=0x4B
    -D KX134_RECEIVER_MAC2=0x12
    -D KX134_RECEIVER_MAC3=0x96
    -D KX134_RECEIVER_MAC4=0x9A
    -D KX134_RECEIVER_MAC5=0x80
    -D KX134_SENSOR1_MAC0=0xD4
    -D KX134_SENSOR1_MAC1=0xE9
    -D KX134_SENSOR1_MAC2=0xF4
    -D KX134_SENSOR1_MAC3=0xE9
    -D KX134_SENSOR1_MAC4=0x8E
    -D KX134_SENSOR1_MAC5=0x1C
    -D KX134_SENSOR2_MAC0=0xD4
    -D KX134_SENSOR2_MAC1=0xE9
    -D KX134_SENSOR2_MAC2=0xF4
    -D KX134_SENSOR2_MAC3=0xC3
    -D KX134_SENSOR2_MAC4=0x37
    -D KX134_SENSOR2_MAC5=0x14

[env:kx134_sensor_1_espnow]
build_flags =
    ${common.build_flags_base}
    -D KX134_NODE_ROLE_SENSOR=1
    -D KX134_NODE_ROLE_RECEIVER=0
    -D KX134_SENSOR_ID=1

[env:kx134_sensor_2_espnow]
build_flags =
    ${common.build_flags_base}
    -D KX134_NODE_ROLE_SENSOR=1
    -D KX134_NODE_ROLE_RECEIVER=0
    -D KX134_SENSOR_ID=2

[env:kx134_receiver_espnow]
build_flags =
    ${common.build_flags_base}
    -D KX134_NODE_ROLE_SENSOR=0
    -D KX134_NODE_ROLE_RECEIVER=1
